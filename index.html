<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Public Land Voting Tool</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='11' height='11' fill='%2300875F'/%3E%3Crect x='17' y='4' width='11' height='11' fill='%230068A6'/%3E%3Crect x='4' y='17' width='11' height='11' fill='%23E6A200'/%3E%3Crect x='17' y='17' width='11' height='11' fill='%23625579'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://server.arcgisonline.com" crossorigin>
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="preconnect" href="https://services3.arcgis.com" crossorigin>
<style>
:root{
  --ink:#1D1A26; --muted:#67646C; --line:#DCDAD6; --mist:#F3F2F0; --paper:#FFFFFF;
  --danger:#9E2F2A;
  --font:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-card:16px; --r-ctl:11px;
  --shadow:0 1px 2px rgba(29,26,38,.07), 0 10px 30px rgba(29,26,38,.11);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--mist);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.on-map{overflow:hidden;height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;min-height:44px;padding:0 16px;border-radius:var(--r-ctl);
  border:1.5px solid var(--line);background:var(--paper);font-weight:600;font-size:15px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#bbb8b2}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-sm{min-height:36px;font-size:14px;padding:0 12px}
.link{color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:0;font-size:inherit;cursor:pointer}
.quiet{font-size:12.5px;font-weight:550;color:var(--muted)}
input.text,select,textarea{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:var(--r-ctl);padding:0 12px;background:var(--paper)}
textarea{padding:11px 12px;min-height:84px;resize:vertical;line-height:1.4}
input.text:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
.code-input{text-transform:uppercase;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;background:var(--mist);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;min-height:30px;padding:0 10px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(29,26,38,.12)}
.seg button:disabled{opacity:.5;cursor:not-allowed}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}

/* ---------- pages (home, start a map, about, invite codes) ---------- */
.page{max-width:720px;margin:0 auto;padding:28px 18px 60px}
.page h1{font-size:26px;letter-spacing:-.015em;margin:0 0 6px}
.page h2{font-size:18px;margin:30px 0 10px;letter-spacing:-.005em}
.page p{margin:0 0 10px}
.lead{font-size:16.5px;color:var(--muted);max-width:62ch}
.panel{background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.join{display:flex;gap:8px}
.join input{flex:1;min-width:0}
.form-msg{color:var(--danger);font-size:14px;margin-top:6px}
.maps{display:grid;gap:10px}
.map-row{display:block;text-decoration:none;background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow);padding:15px 17px}
.map-row:hover{box-shadow:0 1px 2px rgba(29,26,38,.1),0 12px 34px rgba(29,26,38,.16)}
.map-row .q{font-weight:650;font-size:16.5px;line-height:1.3}
.map-row .meta{font-size:13.5px;color:var(--muted);margin-top:4px}
.map-row .kind{display:inline-flex;gap:3px;align-items:center;margin-right:6px;vertical-align:-1px}
.empty{color:var(--muted);font-size:15px;padding:6px 0}
.field{margin-top:16px}
.field label,.field .lbl{display:block;font-weight:600;font-size:14.5px;margin-bottom:5px}
.field .hint{font-size:13.5px;color:var(--muted);margin-top:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid3 label{font-weight:500;font-size:14px;display:flex;align-items:center;gap:6px}
.field label.check{display:flex;font-weight:400;font-size:15px;margin:0}
@media (max-width:520px){.grid2,.grid3{grid-template-columns:1fr}.grid3>div{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid3 label{margin:0!important}.grid3 input{max-width:110px}}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.kinds{grid-template-columns:1fr}}
.kinds label{display:block;border:1.5px solid var(--line);border-radius:var(--r-ctl);padding:11px 13px;cursor:pointer;font-weight:400;margin:0}
.kinds label:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.kinds input{position:absolute;opacity:0;pointer-events:none}
.kinds b{display:flex;align-items:center;gap:6px;font-size:15px}
.kinds span{display:block;font-size:13.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--ink)}
.key-box{background:var(--mist);border-radius:var(--r-ctl);padding:12px 14px;margin:10px 0}
.key-box b{display:block;font-size:20px;letter-spacing:-.005em}
table.t{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:8px}
table.t th{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1.5px solid var(--line)}
table.t td{padding:7px 8px;border-bottom:1px solid var(--mist);vertical-align:top}
table.t td.code{font-variant-numeric:tabular-nums;letter-spacing:.05em;font-weight:600}
.group{margin-top:12px}
.group .gh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.group .gl{font-weight:650;font-size:16px}
.group .gm{font-size:13.5px;color:var(--muted);margin-top:2px}
.group details{margin-top:8px}
.group summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--muted)}
.tools{margin-top:40px;font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.tools .link{font-weight:550;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;text-decoration:none;color:var(--muted);margin-bottom:14px}

/* invite cards, for printing */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:14px}
.invite{border:1.5px dashed #c3c0ba;border-radius:12px;padding:14px;background:#fff;break-inside:avoid}
.invite .iq{font-weight:650;font-size:14.5px;line-height:1.3}
.invite .ib{font-size:12.5px;color:var(--muted);margin-top:2px}
.invite .ic{font-size:22px;font-weight:700;letter-spacing:.07em;margin:8px 0 4px;font-variant-numeric:tabular-nums}
.invite .it{font-size:12.5px;color:var(--muted);line-height:1.4;word-break:break-all}
.invite .qr{width:96px;height:96px;margin-top:8px}
.invite .qr svg{width:100%;height:100%;display:block}
@media print{
  body{background:#fff}
  .no-print{display:none!important}
  .page{max-width:none;padding:0}
  .cards{grid-template-columns:repeat(3,1fr)}
}

/* ---------- the map: one box holds everything ---------- */
#map{position:fixed;inset:0;background:#fff}
.maplibregl-ctrl-attrib{font-size:10.5px}
.box{position:fixed;z-index:10;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:420px;max-height:62vh;max-height:62dvh;overflow:auto;
  background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow);padding:12px 14px}
@media (min-width:900px){.box{left:20px;top:20px;bottom:auto;width:380px;max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px)}}
.box .bt{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px}
.box .name{font-weight:650;color:var(--muted);text-decoration:none}
.box h1{margin:2px 0 0;font-size:17px;line-height:1.3;font-weight:700;letter-spacing:-.01em}
.box .stats{font-size:12.8px;color:var(--muted);margin-top:2px}
.box .stats b{color:var(--ink);font-weight:650}
.box .sec{border-top:1px solid var(--mist);margin-top:10px;padding-top:10px}
.lot-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.lot-h b{font-size:16px;line-height:1.25;display:block}
.lot-h .pin{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.x{width:32px;height:32px;margin:-4px -6px 0 0;border:0;border-radius:8px;background:transparent;display:grid;place-items:center;flex:none}
.x:hover{background:var(--mist)}
.x svg{width:18px;height:18px}
table.key{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
table.key th{font-size:11.5px;font-weight:600;color:var(--muted);text-align:right;padding:0 0 2px 10px;white-space:nowrap}
table.key td{padding:3px 0 3px 10px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.key td:first-child,table.key th:first-child{text-align:left;padding-left:0}
table.key td:first-child{display:flex;align-items:center;gap:7px}
table.key .z{color:#b5b2ad}
table.key td.you{font-weight:700}
table.key td.you::after{content:"✓";margin-left:4px}
.note{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:5px}
.msg{font-size:13px;color:var(--muted);margin-top:6px}
.msg.bad{color:var(--danger)}
.box details{margin-top:8px;font-size:13.5px}
.box summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:13px}
dl.city{display:grid;grid-template-columns:minmax(110px,42%) 1fr;gap:4px 10px;margin:6px 0 0;font-size:13px}
dl.city dt{color:var(--muted)}
dl.city dd{margin:0;word-break:break-word}
dl.city dd.blank{color:#a19da6;font-style:italic}
.others{margin-top:8px;font-size:13px}
.others a{display:block;text-decoration:none;padding:5px 0}
.others .oq{font-weight:600;line-height:1.3}
.others .on{color:var(--muted)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13.5px}
.foot .join input,.foot .join .btn{min-height:40px}
.ctl{display:flex;gap:6px;align-items:center;justify-content:space-between;margin-top:8px}
.locate{position:fixed;z-index:9;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px + var(--box-h,220px) + 10px);width:44px;height:44px;border-radius:50%;border:0;background:var(--paper);box-shadow:var(--shadow);display:grid;place-items:center}
.locate svg{width:21px;height:21px}
@media (min-width:900px){.locate{right:20px;bottom:28px}}

/* list view */
.list{position:fixed;z-index:8;inset:0;background:var(--mist);overflow:auto;padding:12px 12px calc(var(--box-h,220px) + 30px)}
@media (min-width:900px){.list{left:420px;padding:20px 20px 40px}}
.list-inner{max-width:640px;margin:0 auto}
.list .bar{display:flex;gap:8px;position:sticky;top:0;padding:8px 0;background:var(--mist);z-index:1}
.list .bar input{flex:1;min-width:0}
.list .bar select{width:auto;max-width:45%}
.lot{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--paper);border:0;border-radius:12px;padding:10px 13px;margin-top:6px;box-shadow:0 1px 2px rgba(29,26,38,.06)}
.lot .ll{font-weight:600;font-size:15px;line-height:1.3}
.lot .lp{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{min-width:28px;height:24px;padding:0 7px;border-radius:6px;display:inline-grid;place-items:center;font-size:13px;font-weight:650;font-variant-numeric:tabular-nums;border:1px solid rgba(29,26,38,.12);flex:none}
.list .more{font-size:13.5px;color:var(--muted);text-align:center;padding:14px}

/* toast: only for problems */
.toast{position:fixed;z-index:800;left:50%;transform:translate(-50%,10px);opacity:0;pointer-events:none;max-width:min(420px,calc(100% - 24px));width:max-content;
  background:var(--danger);color:#fff;border-radius:12px;padding:11px 16px;font-size:14.5px;line-height:1.3;box-shadow:0 8px 24px rgba(29,26,38,.25);
  transition:opacity .18s,transform .18s;top:calc(env(safe-area-inset-top,0px) + 14px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
.boot b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="map" hidden aria-label="Map of the city's land bank lots"></div>
<div id="app"><div class="boot"><div><b>Public Land Voting Tool</b>Loading…</div></div></div>
<div class="toast" id="toast" role="alert" aria-live="assertive"></div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
/* =========================================================================
   Public Land Voting Tool

   Maps, invite codes, and votes live in the shared database (Supabase,
   see schema.sql), reached only through its pv_* functions. Add ?prototype
   to the address to use a private copy kept in this browser instead, with
   sample maps and tools for trying changes without touching the record.

   Two kinds of map:
   - Question map: the coalition writes the question; a vote means yes.
   - Land bank map: three fixed answers that match the City of Cleveland
     Land Bank's programs (CHOICES below), so every land bank map can be
     compared with every other one, lot by lot.

   Voting, on both: tap a lot to open it; each tap after that moves your
   vote to the next answer, then to no vote. Saved once the taps stop.

   The lots are the City of Cleveland's land bank inventory, read live from
   its open data portal (and kept in the browser until the city edits it).
   ========================================================================= */
const CONFIG = {
  place: "Cleveland",
  parcelsUrl: "https://services3.arcgis.com/dty2kHktVXHrqO8i/arcgis/rest/services/City_Landbank/FeatureServer/0",
  idField: "parcelpin", addressField: "par_addr_all",
  imagery: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  imageryAttribution: "Imagery &copy; Esri, Maxar, Earthstar Geographics",
  imageryOpacity: 0.5,       // 0 to 1: how strongly the aerial photo shows through the white background
  emptyOpacity: 0.2,         // 0 to 1: the white fill on lots nobody has voted for
  labels: "https://tiles.openfreemap.org/styles/positron",   // street names, drawn on top of the photo
  onsiteMeters: 100,         // on-site maps: a vote counts only within this distance of the lot
  listLimit: 200,            // rows shown at once in the list view
  refreshSeconds: 20,        // how often an open map picks up other people's votes
  saveDelay: 800,            // ms after the last tap on a lot before its vote is saved
  // The shared record. The publishable key is meant to be public; the database only allows the pv_* functions.
  supabaseUrl: "https://gftqwwxmtkjipnixuwif.supabase.co",
  supabaseKey: "sb_publishable_qsEiLPwrqJY_dD5u7X15fQ_oR-S8WI4"
};
// Land bank maps: the city's programs, in the order a tap cycles through them. Ramps run light (few votes) to dark (many).
// The keys are stored in the record; the labels can change.
const CHOICES = [
  { key: "open_space", label: "Open space", ramp: ["#D3EEE3", "#93D3B8", "#3FB38A", "#00875F", "#00563D"] },
  { key: "development", label: "Development", ramp: ["#D3E5F3", "#93C1E3", "#3F93CC", "#0068A6", "#003F66"] },
  { key: "yard_expansion", label: "Yard expansion", ramp: ["#FBEBC8", "#F5CF7E", "#E6A200", "#B07A00", "#6E4C00"] }
];
// Question maps: one answer.
const YES = { key: "yes", label: "Votes", ramp: ["#E4E1EA", "#BDB5CC", "#9184A8", "#625579", "#2E2742"] };
const TIE = ["#E6E5E2", "#C9C7C2", "#A3A09A", "#77746E", "#4A4844"];
const LAND_BANK_QUESTION = "What should each lot become?";
const answersOf = m => m.kind === "land_bank" ? CHOICES : [YES];
const budgetsOf = m => m.kind === "land_bank" ? (m.budgets || {}) : { yes: m.budget };
const CH = Object.fromEntries(CHOICES.map(c => [c.key, c]));
const lower = k => (CH[k] || YES).label.toLowerCase();
const SUPABASE_JS = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js";
const QR_JS = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
const PROTOTYPE = new URLSearchParams(location.search).has("prototype") || !CONFIG.supabaseUrl || !CONFIG.supabaseKey;
const WORDS = `acorn alder amber anchor apple arbor ash aspen aster autumn badger barley basil bay beach beacon bear beaver beech bell bench berry birch bison bloom bluff boat bramble branch breeze brick bridge brook bud burrow cabin canal canopy cardinal cedar chalk cherry chestnut chimney cider clay cloud clover coast cobalt comet copper coral corn cove coyote crane creek cricket crow cypress daisy dawn deer delta dew dove dune dusk eagle earth elm ember falcon fennel fern field finch fir firefly flint fog forest fox frog frost garden gate ginger glade glen goose granite grape grass grove gull harbor hare harvest hawk hazel heath hedge heron hickory hill hollow honey ibis iris ivy jade jay juniper kale kestrel lake lamp lane lantern larch lark laurel leaf lemon lilac lily lime linden lynx maple marsh meadow melon mill mink mint mist moon moss moth nest newt nutmeg oak oat ocean olive orchard oriole osprey otter owl pansy park path peach pear pebble pepper pier pine plaza plum pond poplar poppy porch prairie quail quarry rabbit rain raven reed ridge river robin rock rose rowan rye sage salt sand sapling sedge seed shore sky slate snow sorrel sparrow spring spruce square squirrel stone stork storm stream summer sun swallow swan sycamore teal tern thistle thyme tide timber toad tower trail trout tulip turtle valley violet walnut warbler wave whale wheat willow wind winter wolf wren yarrow`.split(/\s+/);

/* ------------------------------------------------------------- utilities */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => new Intl.NumberFormat().format(n);
const plural = (n, one, many) => `${fmt(n)} ${n === 1 ? one : many}`;
const sum = a => a.reduce((x, y) => x + y, 0);
const normId = v => String(v ?? "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
const displayId = id => /^\d{8}$/.test(id) ? `${id.slice(0, 3)}-${id.slice(3, 5)}-${id.slice(5)}` : id;
const normCode = v => String(v || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
const showCode = c => c.length === 8 ? `${c.slice(0, 4)}-${c.slice(4)}` : c;
function randInt(n) { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
const ALPH = "23456789ABCDEFGHJKMNPQRSTUVWXYZ";
const randStr = n => Array.from({ length: n }, () => ALPH[randInt(ALPH.length)]).join("");
function threeWords() { const s = new Set(); while (s.size < 3) s.add(WORDS[randInt(WORDS.length)]); return [...s].join(" "); }
const normKey = k => String(k || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
const ls = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
function downloadFile(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = Object.assign(document.createElement("a"), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
}
const csvCell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;

function buildParcels(raw) {

  }

  for (const it of items) {
    const P = it.f.properties, a = it.addr;

    if (a?.street) { P.a = `Lot on ${a.street}`; continue; }

}

const disp = p => S.byId.get(p)?.properties.d || displayId(p), lotLabel = p => S.byId.get(p)?.properties.a || "";
// Every current vote: on one map, or on all of them.
async function downloadVotes(id) {
  try {
    const rows = await Store.record(id);
    downloadFile(`public-land-votes${id ? "-" + id : ""}-${stamp()}.csv`,
      csv([["map", "question", "parcel", "label", "answer", "member", "group", "voted_at", "on_site"],
        ...rows.map(r => [r.map, r.question, disp(r.parcel), lotLabel(r.parcel), r.choice ? CH[r.choice]?.label || r.choice : "yes", r.member, r.label || "", r.at, r.onsite == null ? "" : r.onsite ? "yes" : "no"])]), "text/csv");
  } catch (e) { toast(errText(e)); }
}
// Land bank maps: one row per lot with votes for each answer.
async function downloadTotals(id) {
  try {
    const m = await Store.map(id), A = answersOf(m), t = await Store.tally(id);
    const rows = [...t].map(([p, n]) => { const l = leadingOf(n, A); return [disp(p), lotLabel(p), ...n, sum(n), l === "tie" ? "Tie" : l ? CH[l].label : ""]; }).sort((a, b) => b[5] - a[5]);
    downloadFile(`public-land-totals-${id}-${stamp()}.csv`, csv([["parcel", "label", ...A.map(c => c.key), "total", "leading"], ...rows]), "text/csv");
  } catch (e) { toast(errText(e)); }
}

/* =====================================================================
   The map. Everything lives in one box: the question and turnout, the
   key (which is also the tally and the votes you have left), the open

function setAnswers(m) {
  S.A = answersOf(m); S.AK = Object.fromEntries(S.A.map((a, i) => [a.key, { ...a, i }]));
  S.zero = S.A.map(() => 0); S.budgets = budgetsOf(m);
}
async function showMap(id, lot) {
  let m; try { m = await Store.map(id); } catch (e) { return errPage(e); }
  const switching = !S.map || S.map.id !== id;
  if (S.sel && gl) setSel(S.sel, false);
  S.map = m; setAnswers(m); S.code = myCodes.get(id); S.member = S.group = null; S.sel = null; S.msg = null; S.others = [];
  if (switching) { S.view = "everyone"; S.mode = "map"; S.listQuery = ""; S.listSort = "votes"; S.recOpen = false; S.tally = new Map(); S.mine = new Map(); }
  if (S.code) {
    try { const r = await Store.join(S.code); if (r.map === id) { S.member = r.member; S.group = r.label; } else S.code = null; }
    catch (e) { if (String(e.message) === "code_not_found") myCodes.del(id); else toast(errText(e)); S.code = null; }
  }
  if (!S.code) S.view = "everyone";
  document.body.classList.add("on-map");
  $("#app").innerHTML = `<section class="box" data-box aria-label="Votes"><div data-top></div><div data-lot></div><div class="sec" data-foot></div></section>
    <button class="locate" data-locate aria-label="Center the map on me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/><circle cx="12" cy="12" r="7.2"/></svg></button>
    <div class="list" data-list hidden></div>`;
  $("[data-locate]").onclick = () => locate(true);
  try { await refresh(); } catch (e) { return errPage(e); }
  if (S.map?.id !== id) return;
  renderTop(); renderLot(); renderFoot();
  if (!S.fc) {
    $("[data-top]").insertAdjacentHTML("beforeend", `<div class="stats" data-wait>Loading the city's lots…</div>`);
    try { await parcelsReady; } catch {}
    $("[data-wait]")?.remove();
    if (!S.fc) { toast(`The city's lots didn't load. ${S.parcelsError || ""}`, 8000); return; }
  }
  await ensureMap();
  if (S.map?.id !== id || !document.body.classList.contains("on-map")) return;
  $("#map").hidden = false; gl.resize();
  painted.clear(); paintAll(); applyView();
  if (lot && S.byId.has(lot)) { flyTo(lot); select(lot); }
  else if (switching && matchMedia("(pointer: coarse)").matches) locate(false);   // on phones, start where the voter is
  startLive();
}
// Other people's votes: picked up every few seconds while a map is open and on screen, never while your own taps are being saved.
let liveTimer = 0, liveBusy = false;
function startLive() {
  clearInterval(liveTimer); if (PROTOTYPE) return;
  liveTimer = setInterval(async () => {
    if (document.hidden || liveBusy || pending.size || inflight || !S.map || !document.body.classList.contains("on-map")) return;
    liveBusy = true;
    try { if (!(await refresh(true))) return; paintAll(); renderTop(); renderLot(); if (S.mode === "list") renderList(); }
    catch {} finally { liveBusy = false; }
  }, CONFIG.refreshSeconds * 1000);
}
// ifIdle: drop what came back if taps were made meanwhile, so it never overwrites a vote not yet saved.
async function refresh(ifIdle = false) {
  const id = S.map.id, code = S.code;
  const [t, mine, m] = await Promise.all([Store.tally(id), code ? Store.mine(code) : new Map(), Store.map(id)]);
  if (S.map?.id !== id || S.code !== code) return false;
  if (ifIdle && (pending.size || inflight)) return false;
  S.tally = t; S.mine = mine; S.map = m; S.budgets = budgetsOf(m);
  S.totals = m.kind === "land_bank" ? CHOICES.map(c => m.by?.[c.key] || 0) : [m.votes];
  setMax(); return true;
}
function setMax() { S.max = 0; for (const n of S.tally.values()) S.max = Math.max(S.max, sum(n)); }
const counts = id => S.tally.get(id) || S.zero;
const level = id => { const t = sum(counts(id)); return t ? Math.max(1, Math.ceil(5 * t / (S.max || 1))) : 0; };
// The leading answer: a key, "tie", or null with no votes.
function leadingOf(n, A) { const t = sum(n); if (!t) return null; const top = Math.max(...n); return n.filter(x => x === top).length > 1 ? "tie" : A[n.indexOf(top)].key; }
const leading = n => leadingOf(n, S.A);
const colorOf = id => { const l = leading(counts(id)), c = level(id); return !l ? "#FFFFFF" : (l === "tie" ? TIE : S.AK[l].ramp)[c - 1]; };
const used = k => { let n = 0; for (const c of S.mine.values()) if (c === k) n++; return n; };
const left = k => Math.max(0, (S.budgets[k] || 0) - used(k));

// Top: name, links, the question, turnout.
function renderTop() {
  const el = $("[data-top]"); if (!el) return;
  const m = S.map, votes = sum(S.totals), lots = S.tally.size;
  el.innerHTML = `<div class="bt"><a class="name" href="#/">← Public Land Voting Tool</a><span class="row" style="gap:12px"><a class="link quiet" href="#/m/${m.id}/about">About</a><button class="link quiet" data-dl>Download</button></span></div>

function bbox() { let x0 = 180, y0 = 90, x1 = -180, y1 = -90; for (const f of S.fc.features) { const p = f.properties; x0 = Math.min(x0, p.cx); y0 = Math.min(y0, p.cy); x1 = Math.max(x1, p.cx); y1 = Math.max(y1, p.cy); } return [[x0, y0], [x1, y1]]; }

/* --- prototype: sample maps with invented votes, sharing lots so they can be compared --- */
async function addSamples() {
  await parcelsReady; if (!S.fc) throw new Error(S.parcelsError || "The city's lots haven't loaded.");
  let seed = 4242; const rnd = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const P = S.fc.features.map(f => f.properties), near = (x, y, r) => P.filter(p => Math.abs(p.cx - x) < r && Math.abs(p.cy - y) * 1.33 < r);
  const hough = near(-81.627, 41.504, 0.012), glenville = near(-81.611, 41.531, 0.012);
  if (hough.length < 30 || glenville.length < 30) throw new Error("Couldn't find lots for the samples.");
  const pick = (pool, hot) => (rnd() < 0.5 ? hot[Math.floor(rnd() * hot.length)] : pool[Math.floor(rnd() * pool.length)]).id;
  const landBank = async (spec, groups, pool) => {
    const r = await Store.create({ kind: "land_bank", question: LAND_BANK_QUESTION, members: groups[0][1], label: groups[0][0], onsite: false, ...spec });
    let codes = r.codes.slice(0, groups[0][2]);
    for (const [label, n, voters] of groups.slice(1)) codes = codes.concat((await Store.addCodes(r.map.id, r.key, n, label)).slice(0, voters));
    const hot = pool.slice(0, 30);
    for (const code of codes) for (const c of CHOICES) {
      const picks = new Set(), want = spec.budgets[c.key];
      while (picks.size < want) picks.add(pick(pool, hot));
      for (const id of picks) { try { await Store.vote(code, id, c.key); } catch {} }
    }
  };
  await landBank({ steward: "Hough Block Club Network (sample)", budgets: { open_space: 5, development: 3, yard_expansion: 2 } },
    [["Hough training, Oct 12", 30, 20], ["Glenville walk, Oct 19", 15, 8]], [...hough, ...glenville.slice(0, 40)]);
  await landBank({ steward: "Ward 7 office (sample)", budgets: { open_space: 3, development: 5, yard_expansion: 2 } },
    [["Ward 7 staff", 12, 9]], [...hough.slice(0, 80)]);
  const q = await Store.create({ kind: "question", question: "Where should our block clubs plant trees first?", steward: "East Side Block Clubs (sample)", budget: 3, members: 25, onsite: true, label: "Tree walk, Oct 5" });
  const pool = [...hough.slice(0, 60), ...glenville], hot = pool.slice(0, 25);
  for (const code of q.codes.slice(0, 17)) { const picks = new Set(); while (picks.size < 3) picks.add(pick(pool, hot)); for (const id of picks) await Store.vote(code, id, "yes", true); }
}

parcelsReady = loadParcels().then(fc => {
  S.fc = fc; S.fields = fc.metadata.fields;
  for (const f of fc.features) S.byId.set(f.properties.id, f);
  S.ids = [...S.byId.keys()];
}).catch(e => { S.parcelsError = e.message || String(e); console.error(e); });
labelsP = loadLabels();

(async () => {

  if (!PROTOTYPE && !window.supabase) {
    try { await loadScript(SUPABASE_JS); }
    catch { $("#app").innerHTML = `<div class="boot"><div><b>The record didn't load</b>Its library comes from cdn.jsdelivr.net. Check the internet connection and reload.</div></div>`; return; }
  }
  route();
})();
