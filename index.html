<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Public Land Voting Tool</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='11' height='11' fill='%2300875F'/%3E%3Crect x='17' y='4' width='11' height='11' fill='%230068A6'/%3E%3Crect x='4' y='17' width='11' height='11' fill='%23E6A200'/%3E%3Crect x='17' y='17' width='11' height='11' fill='%23625579'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://server.arcgisonline.com" crossorigin>
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="preconnect" href="https://services3.arcgis.com" crossorigin>
<style>
:root{
  --ink:#1D1A26; --muted:#67646C; --line:#DCDAD6; --mist:#F3F2F0; --paper:#FFFFFF;
  --danger:#9E2F2A;
  --font:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-card:16px; --r-ctl:11px;
  --shadow:0 1px 2px rgba(29,26,38,.07), 0 10px 30px rgba(29,26,38,.11);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--mist);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.on-map{overflow:hidden;height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;min-height:44px;padding:0 16px;border-radius:var(--r-ctl);
  border:1.5px solid var(--line);background:var(--paper);font-weight:600;font-size:15px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#bbb8b2}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-sm{min-height:36px;font-size:14px;padding:0 12px}
.link{color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:0;font-size:inherit;cursor:pointer}
.quiet{font-size:12.5px;font-weight:550;color:var(--muted)}
input.text,select,textarea{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:var(--r-ctl);padding:0 12px;background:var(--paper)}
textarea{padding:11px 12px;min-height:84px;resize:vertical;line-height:1.4}
input.text:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
.code-input{text-transform:uppercase;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;background:var(--mist);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;min-height:30px;padding:0 10px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(29,26,38,.12)}
.seg button:disabled{opacity:.5;cursor:not-allowed}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}

/* ---------- pages (home, start a map, about, invite codes) ---------- */
.page{max-width:720px;margin:0 auto;padding:28px 18px 60px}
.page h1{font-size:26px;letter-spacing:-.015em;margin:0 0 6px}
.page h2{font-size:18px;margin:30px 0 10px;letter-spacing:-.005em}
.page p{margin:0 0 10px}
.lead{font-size:16.5px;color:var(--muted);max-width:62ch}
.panel{background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.join{display:flex;gap:8px}
.join input{flex:1;min-width:0}
.form-msg{color:var(--danger);font-size:14px;margin-top:6px}
.maps{display:grid;gap:10px}
.map-row{display:block;text-decoration:none;background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow);padding:15px 17px}
.map-row:hover{box-shadow:0 1px 2px rgba(29,26,38,.1),0 12px 34px rgba(29,26,38,.16)}
.map-row .q{font-weight:650;font-size:16.5px;line-height:1.3}
.map-row .meta{font-size:13.5px;color:var(--muted);margin-top:4px}
.map-row .kind{display:inline-flex;gap:3px;align-items:center;margin-right:6px;vertical-align:-1px}
.empty{color:var(--muted);font-size:15px;padding:6px 0}
.field{margin-top:16px}
.field label,.field .lbl{display:block;font-weight:600;font-size:14.5px;margin-bottom:5px}
.field .hint{font-size:13.5px;color:var(--muted);margin-top:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid3 label{font-weight:500;font-size:14px;display:flex;align-items:center;gap:6px}
.field label.check{display:flex;font-weight:400;font-size:15px;margin:0}
@media (max-width:520px){.grid2,.grid3{grid-template-columns:1fr}.grid3>div{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid3 label{margin:0!important}.grid3 input{max-width:110px}}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.kinds{grid-template-columns:1fr}}
.kinds label{display:block;border:1.5px solid var(--line);border-radius:var(--r-ctl);padding:11px 13px;cursor:pointer;font-weight:400;margin:0}
.kinds label:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.kinds input{position:absolute;opacity:0;pointer-events:none}
.kinds b{display:flex;align-items:center;gap:6px;font-size:15px}
.kinds span{display:block;font-size:13.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--ink)}
.key-box{background:var(--mist);border-radius:var(--r-ctl);padding:12px 14px;margin:10px 0}
.key-box b{display:block;font-size:20px;letter-spacing:-.005em}
table.t{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:8px}
table.t th{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1.5px solid var(--line)}
table.t td{padding:7px 8px;border-bottom:1px solid var(--mist);vertical-align:top}
table.t td.code{font-variant-numeric:tabular-nums;letter-spacing:.05em;font-weight:600}
.group{margin-top:12px}
.group .gh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.group .gl{font-weight:650;font-size:16px}
.group .gm{font-size:13.5px;color:var(--muted);margin-top:2px}
.group details{margin-top:8px}
.group summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--muted)}
.tools{margin-top:40px;font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.tools .link{font-weight:550;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;text-decoration:none;color:var(--muted);margin-bottom:14px}

/* invite cards, for printing */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:14px}
.invite{border:1.5px dashed #c3c0ba;border-radius:12px;padding:14px;background:#fff;break-inside:avoid}
.invite .iq{font-weight:650;font-size:14.5px;line-height:1.3}
.invite .ib{font-size:12.5px;color:var(--muted);margin-top:2px}
.invite .ic{font-size:22px;font-weight:700;letter-spacing:.07em;margin:8px 0 4px;font-variant-numeric:tabular-nums}
.invite .it{font-size:12.5px;color:var(--muted);line-height:1.4;word-break:break-all}
.invite .qr{width:96px;height:96px;margin-top:8px}
.invite .qr svg{width:100%;height:100%;display:block}
@media print{
  body{background:#fff}
  .no-print{display:none!important}
  .page{max-width:none;padding:0}
  .cards{grid-template-columns:repeat(3,1fr)}
}

/* ---------- the map: the map, a bar of choices, and the open lot ---------- */
#map{position:fixed;inset:0;background:#fff}
.maplibregl-ctrl-attrib{font-size:10.5px}
.dock{position:fixed;z-index:10;left:0;right:0;bottom:0;padding:0 10px calc(env(safe-area-inset-bottom,0px) + 10px);
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.dock>*{pointer-events:auto;width:100%;max-width:440px}
.vbar{display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:18px;box-shadow:var(--shadow);padding:7px}
.sq{flex:1 1 0;min-width:0;height:50px;border:0;border-radius:12px;background:var(--c);color:#fff;font-size:19px;font-weight:700;
  font-variant-numeric:tabular-nums;display:grid;place-items:center;overflow:hidden;position:relative;
  opacity:.4;filter:saturate(.75);transition:opacity .18s,filter .18s,transform .15s,box-shadow .15s;cursor:default;-webkit-tap-highlight-color:transparent}
.vbar.lit .sq{opacity:1;filter:none;cursor:pointer}
.vbar.lit .sq:active{transform:scale(.95)}
.vbar.lit .sq.cur{box-shadow:0 0 0 2.5px var(--paper),0 0 0 5px var(--ink);transform:translateY(-1px)}
.vbar.lit .sq.lock{box-shadow:inset 0 0 0 3px rgba(255,255,255,.95),0 0 0 2.5px var(--paper),0 0 0 5px var(--c)}
.vbar.lit .sq.lock::after{content:"";position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:#fff}
.sq{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.sq .n{display:inline-block;text-shadow:0 1px 1px rgba(0,0,0,.18)}
.sq .n.down{animation:tickDown .28s ease-out}
.sq .n.up{animation:tickUp .28s ease-out}
@keyframes tickDown{from{transform:translateY(-70%);opacity:0}to{transform:none;opacity:1}}
@keyframes tickUp{from{transform:translateY(70%);opacity:0}to{transform:none;opacity:1}}
.shake{animation:shake .36s ease-in-out}
@keyframes shake{0%,100%{translate:0}20%{translate:-6px}40%{translate:6px}60%{translate:-4px}80%{translate:3px}}
.ib{flex:none;width:44px;height:50px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center;color:var(--ink);-webkit-tap-highlight-color:transparent}
.ib:hover,.ib[aria-expanded="true"]{background:var(--mist)}
.ib svg{width:23px;height:23px}
.idbar{display:flex;gap:6px;background:var(--paper);border-radius:14px;box-shadow:var(--shadow);padding:5px}
.idbar input{flex:1;min-width:0;min-height:38px;border:0;border-radius:10px;background:var(--mist);padding:0 12px;font-size:15px}
.idbar input::placeholder{text-transform:none;letter-spacing:0}
.idbar input:focus{outline:2px solid var(--ink);outline-offset:0}
.idbar .btn{min-height:38px;padding:0 14px;font-size:14px}

/* the open lot: a strip above the bar on phones, a panel on wide screens */
.card{background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow);padding:11px 12px 11px 14px;max-height:calc(100vh - var(--bar-h,80px) - 90px);
  max-height:calc(100dvh - var(--bar-h,80px) - 90px);overflow:auto;overscroll-behavior:contain;touch-action:pan-y}
.card.in{animation:cardIn .2s ease-out}
@keyframes cardIn{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.ch{display:flex;align-items:center;gap:10px}
.ct{flex:1;min-width:0}
.ct b{display:block;font-size:16.5px;line-height:1.25;letter-spacing:-.005em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr{display:flex;align-items:center;gap:8px;margin-top:3px;font-size:13.5px;min-height:20px}
.cr .sp{flex:1}
.cr{flex-wrap:nowrap;min-width:0}
.who{flex:0 1 auto;min-width:0;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--c);color:#fff;
  font-size:12.5px;font-weight:650;line-height:1;padding:5px 8px;border-radius:999px;text-shadow:0 1px 1px rgba(0,0,0,.15)}
.who.ld{flex-shrink:2}
.lnote{font-size:13.5px;margin:0 0 8px;padding-left:9px;border-left:3px solid var(--line)}
.note-in{width:100%;min-height:38px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;margin:0 0 8px;font-size:14px;background:var(--paper)}
.note-in:focus{outline:none;border-color:var(--ink)}
.tip{color:var(--muted)}
.nx{flex:none;width:44px;height:44px;border:0;border-radius:12px;background:var(--mist);display:grid;place-items:center;color:var(--ink)}
.nx:hover{background:#e8e6e2}
.nx svg{width:21px;height:21px}
.cx{border-top:1px solid var(--mist);margin-top:9px;padding-top:9px;font-size:13.5px}
.cx .pin{color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:6px}
table.tl{width:100%;border-collapse:collapse;font-size:14px}
table.tl td{padding:3px 0}
table.tl td:first-child{display:flex;align-items:center;gap:7px}
table.tl td.num{text-align:right;font-weight:600}
table.tl tr.me td{font-weight:700}
.cx h3{font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 4px;letter-spacing:.01em}
dl.city{display:grid;grid-template-columns:minmax(110px,42%) 1fr;gap:4px 10px;margin:0;font-size:13px}
dl.city dt{color:var(--muted)}
dl.city dd{margin:0;word-break:break-word}
dl.city dd.blank{color:#a19da6;font-style:italic}
.others a{display:block;text-decoration:none;padding:5px 0;font-size:13px}
.others .oq{font-weight:600;line-height:1.3}
.others .on{color:var(--muted)}
@media (min-width:900px){
  .card{position:fixed;left:20px;top:20px;width:360px;max-width:none;max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px)}
  .card.in{animation-name:cardInSide}
}
@media (max-width:899.98px){.dock.menu-open .card{display:none}}
@media (min-width:900px){.maplibregl-ctrl-top-left{top:auto;bottom:0}}
@keyframes cardInSide{from{transform:translateX(-12px);opacity:0}to{transform:none;opacity:1}}

/* ⋯ menu: everything that isn't voting */
.menu{align-self:center;background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow);padding:6px;font-size:14.5px;
  max-height:calc(100vh - var(--bar-h,80px) - 40px);max-height:calc(100dvh - var(--bar-h,80px) - 40px);overflow:auto;animation:cardIn .16s ease-out}
.menu .mi{padding:9px 10px 10px;border-bottom:1px solid var(--mist);margin-bottom:4px}
.menu .mi b{display:block;font-size:15.5px;line-height:1.3}
.menu .mi .muted{font-size:13px;margin-top:3px}
.menu .mk{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:13px}
.menu .mk span{display:inline-flex;align-items:center;gap:6px}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:44px;padding:0 10px;border:0;border-radius:10px;background:none;
  text-align:left;text-decoration:none;font-weight:550;color:var(--ink)}
button.mrow:hover,a.mrow:hover{background:var(--mist)}
.mrow.who{font-weight:400;color:var(--muted);border-top:1px solid var(--mist);border-radius:0;margin-top:4px}

.locate{position:fixed;z-index:9;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);width:44px;height:44px;border-radius:14px;border:0;
  background:var(--paper);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink)}
.locate svg{width:21px;height:21px}
@media (min-width:900px){.locate{right:20px;top:20px}}
.zhint{position:fixed;z-index:11;left:50%;bottom:calc(var(--dock-h,80px) + 14px);transform:translate(-50%,6px);background:rgba(29,26,38,.86);color:#fff;
  border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.zhint.show{opacity:1;transform:translate(-50%,0)}

/* list view */
.list{position:fixed;z-index:8;inset:0;background:var(--mist);overflow:auto;padding:12px 12px calc(var(--dock-h,80px) + 24px)}
@media (min-width:900px){.list{padding:20px 20px calc(var(--dock-h,80px) + 30px)}}
.list-inner{max-width:640px;margin:0 auto}
.list .bar{display:flex;gap:8px;position:sticky;top:0;padding:8px 0;background:var(--mist);z-index:1}
.list .bar input{flex:1;min-width:0}
.list .bar select{width:auto;max-width:45%}
.lot{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--paper);border:0;border-radius:12px;padding:10px 13px;margin-top:6px;box-shadow:0 1px 2px rgba(29,26,38,.06)}
.lot .ll{font-weight:600;font-size:15px;line-height:1.3}
.lot .lp{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{min-width:28px;height:24px;padding:0 7px;border-radius:6px;display:inline-grid;place-items:center;font-size:13px;font-weight:650;font-variant-numeric:tabular-nums;border:1px solid rgba(29,26,38,.12);flex:none}
.list .more{font-size:13.5px;color:var(--muted);text-align:center;padding:14px}

/* toast: only for problems */
.toast{position:fixed;z-index:800;left:50%;transform:translate(-50%,10px);opacity:0;pointer-events:none;max-width:min(420px,calc(100% - 24px));width:max-content;
  background:var(--danger);color:#fff;border-radius:12px;padding:11px 16px;font-size:14.5px;line-height:1.3;box-shadow:0 8px 24px rgba(29,26,38,.25);
  transition:opacity .18s,transform .18s;top:calc(env(safe-area-inset-top,0px) + 14px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* home: every map's lots on one map */
.hb-t{flex:1;min-width:0;padding:0 4px 0 8px;font-size:14px;font-weight:600;line-height:1.25}
@media (max-width:360px){.hb-t{font-size:13px}}
.vbar .closed{flex:1;min-width:0;padding:0 8px;font-size:14.5px;font-weight:600;color:var(--muted)}
.cx .shared{font-size:13.5px;font-weight:600;margin:0 0 8px}
.others .ol{color:var(--muted)}
.ramp{display:inline-flex;gap:2px;vertical-align:-1px}

/* share with decision-makers, the sent log, closing and deleting */
.recips{display:grid;gap:2px;margin-top:6px}
.recips label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:15px;cursor:pointer;border-bottom:1px solid var(--mist)}
.recips label:last-child{border-bottom:0}
.recips input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--ink)}
.recips .rr{display:block;font-size:13px;color:var(--muted)}
.mail-meta{font-size:13.5px;color:var(--muted);margin:0 0 8px;overflow-wrap:anywhere}
.mail-body{white-space:pre-wrap;font:inherit;font-size:14.5px;line-height:1.5;background:var(--mist);border-radius:var(--r-ctl);padding:12px 14px;margin:0;overflow-wrap:anywhere}
.ask{background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow);padding:12px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ask b{flex:1 1 auto;font-size:15px}
.dock .ask{padding:6px 6px 6px 14px;border-radius:14px;flex-wrap:nowrap}
.dock .ask .btn{min-height:38px;padding:0 12px;font-size:14px}
.log{display:grid;gap:8px}
.log .le{font-size:14.5px;line-height:1.4}
.log details{margin-top:4px;font-size:13.5px;color:var(--muted)}
.log summary{cursor:pointer;font-weight:600}
.log ol{margin:4px 0 0;padding-left:20px}
.danger{color:var(--danger)}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.disabled{opacity:.45;pointer-events:none}

.boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
.boot b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="map" hidden aria-label="Map of the city's land bank lots"></div>
<div id="app"><div class="boot"><div><b>Public Land Voting Tool</b>Loading…</div></div></div>
<div class="toast" id="toast" role="alert" aria-live="assertive"></div>

/* =========================================================================
   Public Land Voting Tool

     Land Bank's programs (CHOICES below), so every land bank map can be
     compared with every other one, lot by lot.

   Voting, on both: tap a lot to select it, then tap a color in the bar.
   Tap your color again to take the vote back; another color moves it.
   Saved once the taps stop.

   The lots are the City of Cleveland's land bank inventory, read live from
   its open data portal (and kept in the browser until the city edits it).

   One record, many maps: every map writes its votes to the same parcel-keyed
   record. The home page is that record, every lot with a vote on any map;
   each map is one lens on it. A map's leader can send it to the lot's

   each send is logged publicly. A map that was sent can be closed to voting,
   never deleted.

const CONFIG = {

/* ------------------------------------------------------------- utilities */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const budgetText = m => m.kind === "land_bank" ? CHOICES.filter(c => m.budgets?.[c.key] > 0).map(c => `${fmt(m.budgets[c.key])} ${lower(c.key)}`).join(", ") : plural(m.budget, "vote", "votes");

function metersBetween(a, b) {   // [lng, lat] pairs

  const s = Math.sin(dLat / 2) ** 2 + Math.cos(r(a[1])) * Math.cos(r(b[1])) * Math.sin(dLng / 2) ** 2;

const ERR = {

const errText = e => { const m = String(e?.message || e || ""); return ERR[m] || (/fetch|network|Failed|timeout|load failed/i.test(m) ? ERR.network : m || "Something went wrong."); };

const swatches = m => answersOf(m).map(a => `<i class="sw" style="background:${a.ramp[3]}"></i>`).join("");
// The lots where a map's members agree most, best first: [{ parcel, choice, votes, total }]. Agreement is the leading
// answer's votes (question maps: the votes); more votes in all breaks a tie, then the parcel number. Lots where two
// answers tie for the lead are left out. The database's pv_top_lots does the same for the share log.
function topLotsOf(tally, A, n = 3) {
  const lb = A.length > 1, out = [];
  for (const [parcel, c] of tally) {
    const total = sum(c); if (!total) continue;
    const lead = Math.max(...c); if (lb && c.filter(x => x === lead).length > 1) continue;
    out.push({ parcel, choice: lb ? A[c.indexOf(lead)].key : null, votes: lead, total });
  }
  return out.sort((a, b) => b.votes - a.votes || b.total - a.total || (a.parcel < b.parcel ? -1 : a.parcel > b.parcel ? 1 : 0)).slice(0, n);
}

/* =====================================================================
   Store: everything people do. The prototype keeps one record in this
   browser; the shared record is the same functions as database calls.
   Tallies are Map(parcel -> [votes per answer]), in answersOf(map) order.
   Your votes are Map(parcel -> answer key); "yes" on question maps.
   ===================================================================== */
const DB_KEY = "plvt:prototype:v1";
const LocalStore = (() => {
  const empty = () => ({ maps: {}, codes: {}, votes: {}, history: [], shares: [] });
  // votes: "map|parcel|member" -> { at, onsite, choice }; codes: CODE -> { map, member, label, used_at }
  let db = ls.get(DB_KEY) || empty(); db.shares ||= [];
  const save = () => { if (!ls.set(DB_KEY, db)) toast("This browser couldn't save. Is it in private mode?"); };
  const mapOr404 = id => { const m = db.maps[id]; if (!m) throw new Error("map_not_found"); m.kind ||= "question"; return m; };
  const codesOf = id => Object.entries(db.codes).filter(([, c]) => c.map === id);
  const votesOf = id => Object.entries(db.votes).filter(([k]) => k.startsWith(id + "|")).map(([k, v]) => { const [, parcel, member] = k.split("|"); return { parcel, member: +member, choice: null, ...v }; });
  const byOf = votes => Object.fromEntries(CHOICES.map(c => [c.key, votes.filter(v => v.choice === c.key).length]));
  const labelOf = (map, member) => Object.values(db.codes).find(c => c.map === map && c.member === member)?.label || null;
  const pub = m => {
    const kind = m.kind || "question", codes = codesOf(m.id).map(([, c]) => c).sort((a, b) => a.member - b.member), votes = votesOf(m.id), groups = [];
    for (const c of codes) { let g = groups.find(x => x.label === (c.label || null)); if (!g) groups.push(g = { label: c.label || null, issued: 0, used: 0 }); g.issued++; if (c.used_at) g.used++; }
    return { id: m.id, kind, question: m.question, steward: m.steward, budget: kind === "question" ? m.budget : null, budgets: kind === "land_bank" ? m.budgets : null,
      onsite: m.onsite, created_at: m.created_at, leader: m.leader || null, leader_member: m.leader_member || null, closed_at: m.closed_at || null,
      shared: sharesOf(m.id).length, last_shared: sharesOf(m.id)[0]?.sent_at || null, issued: codes.length, used: codes.filter(c => c.used_at).length, votes: votes.length,
      lots: new Set(votes.map(v => v.parcel)).size, by: kind === "land_bank" ? byOf(votes) : null, groups };
  };
  const cleanLabel = l => { const t = String(l ?? "").trim(); if (t.length > 80) throw new Error("bad_label"); return t || null; };
  const newCodes = (m, n, label) => { const out = []; for (let i = 0; i < n; i++) { let c; do c = randStr(8); while (db.codes[c]); db.codes[c] = { map: m.id, member: ++m.members, label, used_at: null }; out.push(c); } return out; };
  const codeOr = (code, err) => { const c = db.codes[normCode(code)]; if (!c) throw new Error(err); return c; };
  const sharesOf = id => db.shares.filter(x => x.map === id).sort((a, b) => b.sent_at.localeCompare(a.sent_at) || b.id - a.id);
  const leaderMap = code => { const c = db.codes[normCode(code)], m = c && db.maps[c.map]; if (!m || m.leader_member !== c.member) throw new Error("not_leader"); m.kind ||= "question"; return m; };
  const openOr = m => { if (m.closed_at) throw new Error("closed"); };
  const tallyOf = id => { const A = answersOf(mapOr404(id)), t = new Map(); for (const v of votesOf(id)) { const a = t.get(v.parcel) || A.map(() => 0); a[A.length > 1 ? A.findIndex(x => x.key === v.choice) : 0]++; t.set(v.parcel, a); } return t; };
  const shareOut = x => ({ id: x.id, sent_at: x.sent_at, recipients: x.recipients, voters: x.voters, members: x.members, top: x.top });
  return {
    async maps() { return Object.values(db.maps).map(pub).sort((a, b) => b.created_at.localeCompare(a.created_at)); },
    async map(id) { return pub(mapOr404(id)); },
    async create({ kind = "question", question, steward, budget, budgets, members, onsite, label, leader }) {
      if (!["question", "land_bank"].includes(kind)) throw new Error("bad_kind");
      let q = String(question || "").trim(); if (kind === "land_bank" && !q) q = LAND_BANK_QUESTION;
      if (!q || q.length > 200) throw new Error("bad_question");
      let b = null;

      else {
        b = {}; for (const c of CHOICES) { const n = budgets?.[c.key]; if (!Number.isInteger(n) || n < 0 || n > 100) throw new Error("bad_budget"); b[c.key] = n; }

    async unvote(code, parcel) {

    async tally(id) { return tallyOf(id); },
    async mine(code) { const c = db.codes[normCode(code)]; if (!c) return new Map(); return new Map(votesOf(c.map).filter(v => v.member === c.member).map(v => [v.parcel, v.choice || "yes"])); },
    async lotMaps(parcel) {

function buildParcels(raw) {
  const items = [], seen = new Set();

    const g = f.geometry; if (!g || (g.type !== "Polygon" && g.type !== "MultiPolygon")) continue;
    const p = f.properties || {}, id = normId(p[CONFIG.idField]); if (!id || seen.has(id)) continue;
    seen.add(id);

  }

  for (const it of items) if (it.addr?.full) { const k = gk(it.f.properties.cx, it.f.properties.cy); grid.has(k) ? grid.get(k).push(it) : grid.set(k, [it]); }

    if (a?.full) { P.a = a.full; continue; }
    if (a?.street) { P.a = `Lot on ${a.street}`; continue; }

// Everyone who covers these lots, each with how many of the lots they cover, most first:
// { council: [{ ward, n, ...COUNCIL[ward] }], cdcs: [{ name, n, ...contact }], planners: [{ n, ...PLANNERS[key] }], places: [{ name, n }] }.
// A lot gets the CDC the city ranks first where service areas overlap, like the lot contacts tool.
async function decisionMakers(lots) {
  const pts = lots.map(p => [+p.cx.toFixed(6), +p.cy.toFixed(6)]);
  const regionUrl = await (regionLayerP ||= discoverRegionLayer());
  const [wards, cdc, cdcNW, spa, region] = await Promise.all([
    polygonsAt(CONTACT_LAYERS.wards, pts), polygonsAt(CONTACT_LAYERS.cdc, pts),
    polygonsAt(CONTACT_LAYERS.cdcNW, pts).catch(() => []), polygonsAt(CONTACT_LAYERS.spa, pts).catch(() => []),
    regionUrl ? polygonsAt(regionUrl, pts).catch(() => []) : []
  ]);
  const tally = new Map(), add = (k, v) => { const r = tally.get(k) || { ...v, n: 0 }; r.n++; tally.set(k, r); };
  for (const pt of pts) {
    const w = wards.find(f => inPolygon(pt, f.geometry)); if (!w) continue;   // outside the city
    const ward = Number(w.properties.Ward ?? w.properties.Ward_txt);
    if (COUNCIL[ward]) add(`w${ward}`, { kind: "council", ward, ...COUNCIL[ward] });
    let cs = cdc.filter(f => inPolygon(pt, f.geometry)).map(f => ({ name: pickName(f.properties, ["CDCNAME"]), rank: Number(f.properties.RankOrder) }));
    const nw = cdcNW.find(f => inPolygon(pt, f.geometry));
    if (nw) { cs = cs.filter(c => !/detroit\s*shoreway|cudell/i.test(c.name || "")); cs.unshift({ name: pickName(nw.properties) || "Northwest Neighborhoods CDC", rank: 0 }); }
    cs = cs.filter(c => c.name).sort((a, b) => (isNaN(a.rank) ? 99 : a.rank) - (isNaN(b.rank) ? 99 : b.rank));
    if (cs[0]) add(`c${cs[0].name}`, { kind: "cdc", name: cs[0].name, ...cdcContact(cs[0].name) });
    const sp = spa.find(f => inPolygon(pt, f.geometry)), place = sp ? pickName(sp.properties, ["SPA_NAME", "SPA_NAMES", "NAME", "Neighborhood", "NEIGHBORHOOD", "NBHD_NAME", "SPA"]) : null;
    if (place) add(`s${place}`, { kind: "place", name: place });
    const rg = region.find(f => inPolygon(pt, f.geometry));
    const key = (rg && regionKeyFromAttrs(rg.properties)) || regionForNeighborhood(place);
    add(`p${key || "fallback"}`, { kind: "planner", ...(key ? PLANNERS[key] : PLANNING_FALLBACK) });
  }
  const list = k => [...tally.values()].filter(r => r.kind === k).sort((a, b) => b.n - a.n);
  return { council: list("council"), cdcs: list("cdc"), planners: list("planner"), places: list("place") };
}

const views = () => S.map?.leader_member ? ["mine", "leader", "everyone"] : ["mine", "everyone"];

function cycleView() {

function tapSquare(key, b) {

}
// Vote the selected lot with this answer: same answer takes it back, another moves it, none left shakes.
function voteKey(key, b = $(`[data-sq="${key}"]`)) {
  const id = S.sel; if (!id || S.map?.closed_at) return;   // no lot selected: the squares are the key
  if (!S.code) { const f = $("[data-join]"); shake(f); $("#m-code")?.focus(); return; }
  const cur = S.mine.get(id) || null;
  if (cur === key) { setChoice(id, null); feedback(id, null); return; }   // same color: take it back
  if (left(key) <= 0) { shake(b); return; }                                // none left of that color
  setChoice(id, key); feedback(id, key); markVoted();                      // new vote, or moved from another color

}
// Hold a color (long-press / double-click): every lot tapped then gets it.

}
function setLock(key) { S.lock = key || null; updateBar(); }
// A lot tapped while a color is held gets that color; if it already has it, the vote comes back.

  if (left(k) <= 0) { setLock(null); shake($(`[data-sq="${k}"]`)); return; }

}
function feedback(id, key) {

// The leader's note on a lot: saved after the lot's vote is.
function saveNote(id, text) {

  cur.note = t || null; const code = S.code;

// The city's recommended use for a lot, as an answer key: only on land bank maps, only if the city publishes one.

/* --- votes: shown at once, saved once the taps on that lot stop (three quick taps, one write) --- */
const pending = new Map();   // lot -> { from, to, timer, code, map, onsite }
const chains = new Map();    // lot -> the save in flight, so saves on one lot go out in order
let inflight = 0;
function setChoice(id, to) {
  const cur = S.mine.get(id) || null, n = [...counts(id)];
  if (cur) { n[S.AK[cur].i]--; S.totals[S.AK[cur].i]--; }
  if (to) { n[S.AK[to].i]++; S.totals[S.AK[to].i]++; }
  sum(n) ? S.tally.set(id, n) : S.tally.delete(id);
  to ? S.mine.set(id, to) : S.mine.delete(id);
  if (isLeader()) to ? S.leader.set(id, { choice: to, note: S.leader.get(id)?.note || null }) : S.leader.delete(id);
  setMax();
  const p = pending.get(id) || { from: cur, code: S.code, map: S.map.id, onsite: S.map.onsite };
  clearTimeout(p.timer); p.to = to; p.timer = setTimeout(() => flush(id), CONFIG.saveDelay);
  pending.set(id, p);
  paintAll(); updateBar(); renderCard(); renderMenu(); if (S.mode === "list") renderList();
}
function flush(id) {
  const p = pending.get(id); if (!p) return;
  clearTimeout(p.timer); pending.delete(id);
  if (p.to === p.from) return settle();
  inflight++;
  const run = (chains.get(id) || Promise.resolve()).then(() => save(id, p))
    .catch(e => { if (S.map?.id === p.map) toast(errText(e), 6000); })
    .finally(() => { inflight--; if (chains.get(id) === run) chains.delete(id); settle(); });
  chains.set(id, run);
}
async function save(id, p) {
  if (!p.to) return Store.unvote(p.code, id);
  let onsite = null;
  if (p.onsite) {   // on-site maps: check where the voter is now, and keep only yes or no
    const lot = S.byId.get(id).properties, d = metersBetween(await position(true), [lot.cx, lot.cy]);
    onsite = d <= CONFIG.onsiteMeters;
    if (!onsite) throw new Error(`You're ${d < 1000 ? fmt(Math.round(d)) + " m" : (d / 1000).toFixed(1) + " km"} from this lot. This map counts votes only within ${CONFIG.onsiteMeters} m.`);
  }

}
function flushAll() { for (const id of [...pending.keys()]) flush(id); }
async function settle() {   // once every tap is saved, read the record back
  if (pending.size || inflight || !S.map) return;
  try { if (!(await refresh(true))) return; } catch (e) { toast(errText(e)); }
  if (!document.body.classList.contains("on-map")) return;
  paintAll(); updateBar(); renderCard(); renderMenu(); if (S.mode === "list") renderList();
}
document.addEventListener("visibilitychange", () => { if (document.hidden) flushAll(); });
window.addEventListener("pagehide", flushAll);

/* --- selecting lots --- */
async function select(id) {
  if (S.sel && S.sel !== id) setSel(S.sel, false);
  const fresh = !S.sel;
  S.sel = id; S.others = []; S.lotShared = 0; setSel(id, true);
  if (S.menu) { S.menu = false; renderMenu(); }
  renderCard(fresh); updateBar(); keepInView(id);
  const here = S.map?.id;
  const [others, shared] = await Promise.all([Store.lotMaps(id).then(r => r.filter(o => o.id !== here)).catch(() => []), Store.lotShared(id).catch(() => 0)]);
  if (S.sel === id && S.map?.id === here) { S.others = others; S.lotShared = shared; if (others.length || shared) renderCard(); }
}
const sharedLine = () => S.lotShared ? `<div class="shared">Shared with the city in ${plural(S.lotShared, "map", "maps")}.</div>` : "";
function closeLot() { if (!S.sel) return; setSel(S.sel, false); S.sel = null; S.more = false; S.others = []; renderCard(); updateBar(); }
// The closest lot you haven't voted on (and haven't stepped past with this button).
function nextNearby() {
  if (!S.sel) return;
  const from = S.byId.get(S.sel).properties, kx = Math.cos(from.cy * Math.PI / 180);
  S.skipped.add(S.sel);
  let best = null, bd = Infinity;
  for (const f of S.fc.features) {
    const p = f.properties; if (S.mine.has(p.id) || S.skipped.has(p.id)) continue;
    const d = ((p.cx - from.cx) * kx) ** 2 + (p.cy - from.cy) ** 2; if (d < bd) { bd = d; best = p.id; }
  }
  if (!best) return shake($("[data-next]"));
  select(best);
}
function position(fresh) {   // fresh: on-site votes need where the voter is now, not a minute ago
  return new Promise((ok, no) => {
    if (!navigator.geolocation) return no(new Error("This browser can't share its location."));
    navigator.geolocation.getCurrentPosition(p => { S.me = [p.coords.longitude, p.coords.latitude]; showMe(); ok(S.me); },
      e => no(new Error(e.code === 1 ? "Location is turned off for this page. Turn it on to vote on this map." : "Couldn't find where you are. Try again outside or near a window.")),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: fresh ? 0 : 10000 });
  });
}
async function locate(loud) {
  try { const me = await position(); gl.flyTo({ center: me, zoom: Math.max(gl.getZoom(), 16.5), duration: 900 }); }
  catch (e) { if (loud) toast(e.message); }
}

/* --- list view (under ⋯): every lot, including the ones without addresses --- */

      <select id="l-s" aria-label="Sort">${opts.map(([v, t]) => `<option value="${v}" ${S.listSort === v ? "selected" : ""}>${esc(t)}</option>`).join("")}</select></div>
    ${shown.map(id => { const p = S.byId.get(id).properties, n = counts(id), t = sum(n), col = colorOf(id), dark = level(id) >= 4, mine = S.mine.get(id);
      return `<button class="lot" data-lot="${id}"><div><div class="ll">${esc(p.a)}</div><div class="lp">${esc(p.d)}${mine ? ` · <b style="color:var(--ink)">${lb ? `You: ${esc(lower(mine))}` : "Your vote"}</b>` : ""}</div></div>
        <span class="chip" style="background:${col};color:${dark ? "#fff" : "var(--ink)"}" title="${esc(S.A.map((a, i) => `${a.label} ${n[i]}`).join(", "))}">${fmt(t)}</span></button>`; }).join("")}
    <div class="more">${sorted.length ? `${fmt(shown.length)} of ${plural(sorted.length, "lot", "lots")}${sorted.length > shown.length ? ". Search to narrow it down." : ""}` : S.view === "mine" ? "You haven't voted on this map yet." : S.view === "leader" ? "No leader votes yet." : "No lots match."}</div></div>`;
  const qi = $("#l-q", el); qi.oninput = () => { S.listQuery = qi.value; renderList(); };

/* --- drawing the map --- */
// Feature state per lot: k = leading answer (1-3, 9 tie, 0 none), c = agreement (0-5), m = your answer (1-3, 0 none), s = selected.
const painted = new Map();   // l = the leader's answer (1-3, 0 none)
function fsSet(id, st) { gl.setFeatureState({ source: "parcels", id }, st); gl.setFeatureState({ source: "pts", id }, st); }
function paint(id) {
  const l = leading(counts(id)), k = !l ? 0 : l === "tie" ? 9 : S.AK[l].i + 1, c = level(id), mine = S.mine.get(id), m = mine && S.AK[mine] ? S.AK[mine].i + 1 : 0;
  const ld = S.leader.get(id)?.choice, ll = ld && S.AK[ld] ? S.AK[ld].i + 1 : 0, key = ll * 1000 + k * 100 + c * 10 + m;
  if (painted.get(id) !== key) { painted.set(id, key); fsSet(id, { k, c, m, l: ll }); }
}
function paintAll() { if (gl) for (const id of S.ids) S.home ? paintHome(id) : paint(id); }
function setSel(id, on) { if (gl) fsSet(id, { s: on }); }
// Mine: your lots solid in your color, the rest bare outlines. Leader: the same for the leader's lots, with a dashed edge.
// Everyone: the leading answer's color, stronger where more members agree.
const AGREE = [0.4, 0.55, 0.7, 0.82, 0.92];

  const k = ["coalesce", ["feature-state", "k"], 0], c = ["coalesce", ["feature-state", "c"], 0], m = ["coalesce", ["feature-state", "m"], 0];
  const l = ["coalesce", ["feature-state", "l"], 0], own = S.view === "mine" ? m : S.view === "leader" ? l : null, mineView = !!own;
  const fill = mineView ? ["match", own, ...S.A.flatMap((a, i) => [i + 1, a.ramp[3]]), "#FFFFFF"]
    : ["match", k, ...S.A.flatMap((a, i) => [i + 1, a.ramp[3]]), 9, TIE[3], "#FFFFFF"];
  const op = mineView ? ["match", own, 0, 0, 0.92] : ["match", c, 0, CONFIG.emptyOpacity, ...AGREE.slice(0, 4).flatMap((o, i) => [i + 1, o]), AGREE[4]];
  const has = mineView ? [">", own, 0] : [">", c, 0];
  gl.setPaintProperty("lead-line", "line-opacity", S.view === "leader" ? ["case", [">", l, 0], 0.95, 0] : 0);
  gl.setPaintProperty("lots-fill", "fill-color", fill); gl.setPaintProperty("lots-fill", "fill-opacity", op);
  gl.setPaintProperty("lots-case", "line-opacity", mineView ? 0.28 : 0.45);
  gl.setPaintProperty("lots-line", "line-opacity", mineView ? 0.75 : 0.9);
  gl.setPaintProperty("lots-dots", "circle-color", fill);
  gl.setPaintProperty("lots-dots", "circle-radius", ["interpolate", ["linear"], ["zoom"], 10, ["case", has, 3, 1.6], 14, ["case", has, 4.6, 2.8]]);
  gl.setPaintProperty("lots-dots", "circle-opacity", ["interpolate", ["linear"], ["zoom"], 13.6, mineView ? ["case", has, 1, 0] : ["case", has, ["match", c, ...AGREE.flatMap((o, i) => [i + 1, Math.min(1, o + 0.1)]), 1], 1], 14.6, 0]);
  gl.setPaintProperty("lots-dots", "circle-stroke-opacity", ["interpolate", ["linear"], ["zoom"], 13.6, 1, 14.6, 0]);

const joinNames = l => l.length <= 1 ? l.join("") : l.length === 2 ? `${l[0]} and ${l[1]}` : `${l.slice(0, -1).join(", ")}, and ${l[l.length - 1]}`;
// The email: turnout and place first, then where members agree most, then the link. Kept under ~2,000 characters as a mailto link.
function buildShareMail(m, place, top, to) {
  const subject = place ? `${place}: ${m.question}` : m.question;
  const turnout = `${fmt(m.used)} of ${plural(m.issued, "member", "members")} ${m.issued === 1 ? "has" : "have"} voted.`;
  const body = (lots, names) => [turnout, "", ...(lots.length ? ["Where members agree most:", ...lots.map((t, i) => topLine(t, i, m.kind, names)), ""] : []), `The map: ${mapUrl(m.id)}`].join("\n");
  const href = b => `mailto:${to.join(",")}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(b)}`;
  for (const [n, names] of [[3, true], [3, false], [1, false], [0, false]]) {
    const b = body(top.slice(0, n), names), h = href(b);
    if (h.length <= 2000) return { subject, body: b, href: h, ok: true };
  }
  return { subject, body: body([], false), href: "", ok: false };
}

async function showShare(id) {
  let m; try { m = await Store.map(id); } catch (e) { return errPage(e); }
  const code = await leaderCodeOf(id, m), back = `<a class="back" href="#/m/${id}">← Back to the map</a>`, here = location.hash;
  if (!code) {
    setPage(`<main class="page">${back}<h1>Share this map</h1><p class="lead">${esc(m.question)}</p>
      <div class="panel"><div class="row" style="flex-wrap:nowrap"><input class="text" readonly value="${esc(mapUrl(id))}" aria-label="The map's address" style="flex:1;min-width:0"><button class="btn btn-dark" data-copy>Copy</button></div>
      <p class="muted" style="font-size:14px;margin:10px 0 0">Sending it to decision-makers is for the map's leader, signed in on the map with their leader code.</p></div></main>`);
    $("[data-copy]").onclick = async e => { try { await navigator.clipboard.writeText(mapUrl(id)); e.target.textContent = "Copied"; } catch { $("input[readonly]").select(); } };
    return;
  }
  let shares = [];
  setPage(`<main class="page">${back}<h1>Share with decision-makers</h1><p class="lead">${esc(m.question)}</p>
    <div data-ask></div><div data-body><div class="panel"><p class="muted" style="margin:0">Finding who covers the lots on this map…</p></div></div>
    <div data-log></div></main>`);
  const stillHere = () => location.hash === here;
  const renderLog = () => { const el = $("[data-log]"); if (el) el.innerHTML = shares.length ? `<h2>Shared before</h2>${logHtml(shares, m.kind)}` : ""; };
  // Did you send it? Asked inline (never a pop-up), and only a yes adds to the log.
  const ask = p => {
    const el = $("[data-ask]"); if (!el) return;
    if (!p) { el.innerHTML = ""; return; }
    el.innerHTML = `<div class="ask" style="margin-bottom:14px"><b>Did you send it?</b><button class="btn btn-dark" data-yes>Yes, I sent it</button><button class="btn" data-no>Not yet</button></div>`;
    $("[data-yes]", el).onclick = async ev => {
      ev.target.disabled = true;
      try { const e = await confirmShare(code, p); shares.unshift(e); m = await Store.map(id).catch(() => m); renderLog();
        el.innerHTML = `<div class="panel" style="margin-bottom:14px"><b>Added to the map's record.</b><div class="muted" style="font-size:14px;margin-top:4px">${esc(shareLine(e))}</div></div>`; }
      catch (e) { ev.target.disabled = false; toast(errText(e)); }
    };
    $("[data-no]", el).onclick = () => { pendingShare.clear(); ask(null); };
  };
  ask(pendingShare.get(id));
  let t;
  try { [t, shares] = await Promise.all([Store.tally(id), Store.shares(id)]); } catch (e) { if (stillHere()) $("[data-body]").innerHTML = `<div class="panel"><p class="danger" style="margin:0">${esc(errText(e))}</p></div>`; return; }
  if (!stillHere()) return;
  renderLog();
  try { await parcelsReady; } catch {}
  if (!stillHere()) return;
  const body = $("[data-body]");
  if (!S.fc) { body.innerHTML = `<div class="panel"><p class="danger" style="margin:0">The city's lots didn't load. ${esc(S.parcelsError || "")}</p></div>`; return; }
  const lots = [...t.keys()].map(p => S.byId.get(p)?.properties).filter(Boolean);
  if (!lots.length) { body.innerHTML = `<div class="panel"><p style="margin:0">Nobody has voted on this map yet. The lots with votes decide who it goes to.</p></div>`; return; }
  let dm;
  const look = async () => {
    try { dm = await decisionMakers(lots); }
    catch (e) {
      if (!stillHere()) return;
      body.innerHTML = `<div class="panel"><p class="danger" style="margin:0 0 10px">Couldn't reach the City's open data service. Check the connection and try again.</p><button class="btn" data-retry>Try again</button></div>`;
      $("[data-retry]").onclick = () => { body.innerHTML = `<div class="panel"><p class="muted" style="margin:0">Finding who covers the lots on this map…</p></div>`; look(); };
      return;
    }
    if (stillHere()) draw();
  };
  const draw = () => {
    const many = k => dm[k].length > 1, lotsN = (k, n) => many(k) ? ` · ${plural(n, "lot", "lots")}` : "";
    const people = [
      ...dm.council.map(c => ({ name: c.name, role: `Council member, Ward ${c.ward}${lotsN("council", c.n)}`, email: c.email, office: `Ward ${c.ward}`, person: c.name })),
      ...dm.cdcs.map(c => ({ name: c.name, role: `Community development corporation${lotsN("cdcs", c.n)}`, email: c.email || "", office: c.name })),
      ...dm.planners.map(p => p.page ? { name: p.name, role: `Neighborhood planner, ${p.region}${lotsN("planners", p.n)}`, email: p.email, office: `Neighborhood planner, ${p.region}`, person: p.name }
        : { name: p.name, role: `City planning${lotsN("planners", p.n)}`, email: p.email, office: p.name }),
      { name: LAND_BANK.name, role: LAND_BANK.sub, email: LAND_BANK.email, office: LAND_BANK.name }
    ];
    const on = people.map(() => true);
    const places = dm.places.map(x => x.name);
    const place = places.length > 2 ? `${places.slice(0, 2).join(", ")} and nearby` : joinNames(places) || (dm.council.length === 1 ? `Ward ${dm.council[0].ward}` : "");
    const top = topLotsOf(t, answersOf(m), 3);
    body.innerHTML = `<div class="panel">
        <div style="font-weight:650">Send to</div>
        <div class="recips">${people.map((x, i) => `<label><input type="checkbox" data-r="${i}" checked><span><b>${esc(x.name)}</b>
          <span class="rr">${esc(x.role)} · ${x.email ? esc(x.email) : "no email on file; add it in your email app"}</span></span></label>`).join("")}</div>
      </div>
      <div class="panel" style="margin-top:12px">
        <div class="mail-meta" data-meta></div>
        <pre class="mail-body" data-mail></pre>
        <div class="row" style="margin-top:12px" data-acts><a class="btn btn-dark" data-send href="#">Open in my email app</a><button class="btn" data-copytext>Copy the email</button></div>
        <div class="form-msg" data-mmsg hidden></div>
      </div>`;
    let mail;
    const update = () => {
      const chosen = people.filter((x, i) => on[i]), to = chosen.map(x => x.email).filter(Boolean);
      mail = buildShareMail(m, place, top, to);
      $("[data-meta]").innerHTML = `<b>To:</b> ${esc(to.join(", ") || "nobody yet")}<br><b>Subject:</b> ${esc(mail.subject)}`;
      $("[data-mail]").textContent = mail.body;
      const a = $("[data-send]"), msg = $("[data-mmsg]");
      const can = chosen.length && mail.ok;
      a.setAttribute("href", can ? mail.href : "#"); a.classList.toggle("disabled", !can); a.setAttribute("aria-disabled", String(!can));
      msg.hidden = mail.ok; msg.textContent = mail.ok ? "" : "That's too many people for one email. Uncheck a few.";
    };
    $$("[data-r]", body).forEach(cb => cb.onchange = () => { on[+cb.dataset.r] = cb.checked; update(); });
    $("[data-send]").onclick = e => {
      const chosen = people.filter((x, i) => on[i]);
      if (!chosen.length || !mail.ok) { e.preventDefault(); return; }
      pendingShare.set(id, chosen.map(x => ({ office: x.office, name: x.person || null })));
      setTimeout(() => { if (stillHere()) { ask(pendingShare.get(id)); window.scrollTo({ top: 0, behavior: calm() ? "auto" : "smooth" }); } }, 900);
    };
    $("[data-copytext]").onclick = async e => {
      const text = `To: ${people.filter((x, i) => on[i]).map(x => x.email).filter(Boolean).join(", ")}\nSubject: ${mail.subject}\n\n${mail.body}`;
      try { await navigator.clipboard.writeText(text); e.target.textContent = "Copied"; } catch { toast("Couldn't copy. Select the text and copy it instead."); return; }
      pendingShare.set(id, people.filter((x, i) => on[i]).map(x => ({ office: x.office, name: x.person || null })));
      setTimeout(() => { if (stillHere()) ask(pendingShare.get(id)); }, 900);
    };
    update();
  };
  look();
}

/* --- prototype: sample maps with invented votes, sharing lots so they can be compared --- */
async function addSamples() {
  await parcelsReady; if (!S.fc) throw new Error(S.parcelsError || "The city's lots haven't loaded.");
  let seed = 4242; const rnd = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const P = S.fc.features.map(f => f.properties), near = (x, y, r) => P.filter(p => Math.abs(p.cx - x) < r && Math.abs(p.cy - y) * 1.33 < r);
  const hough = near(-81.627, 41.504, 0.012), glenville = near(-81.611, 41.531, 0.012);
  if (hough.length < 30 || glenville.length < 30) throw new Error("Couldn't find lots for the samples.");
  const pick = (pool, hot) => (rnd() < 0.5 ? hot[Math.floor(rnd() * hot.length)] : pool[Math.floor(rnd() * pool.length)]).id;
  const landBank = async (spec, groups, pool) => {
    const r = await Store.create({ kind: "land_bank", question: LAND_BANK_QUESTION, members: groups[0][1], label: groups[0][0], onsite: false, ...spec });
    const hot0 = pool.slice(0, 30), notes = ["Next to the community garden", "Neighbors already mow it", "Faces the new homes on this block"];
    let n = 0;   // the leader's first pass: the hot lots, a few with notes
    for (const c of CHOICES) for (let i = 0; i < spec.budgets[c.key]; i++) {
      const id = hot0[n++ % hot0.length].id; try { await Store.vote(r.leaderCode, id, c.key); if (n <= notes.length) await Store.setNote(r.leaderCode, id, notes[n - 1]); } catch {}
    }
    let codes = r.codes.slice(0, groups[0][2]);
    for (const [label, n, voters] of groups.slice(1)) codes = codes.concat((await Store.addCodes(r.map.id, r.key, n, label)).slice(0, voters));
    const hot = pool.slice(0, 30);
    for (const code of codes) for (const c of CHOICES) {
      const picks = new Set(), want = spec.budgets[c.key];
      while (picks.size < want) picks.add(pick(pool, hot));
      for (const id of picks) { try { await Store.vote(code, id, c.key); } catch {} }
    }
  };
  await landBank({ steward: "Hough Block Club Network (sample)", leader: "Tim (WRLC)", budgets: { open_space: 5, development: 3, yard_expansion: 2 } },
    [["Hough training, Oct 12", 30, 20], ["Glenville walk, Oct 19", 15, 8]], [...hough, ...glenville.slice(0, 40)]);
  await landBank({ steward: "Ward 7 office (sample)", leader: "Ward 7 staff", budgets: { open_space: 3, development: 5, yard_expansion: 2 } },
    [["Ward 7 staff", 12, 9]], [...hough.slice(0, 80)]);
  const q = await Store.create({ kind: "question", question: "Where should our block clubs plant trees first?", steward: "East Side Block Clubs (sample)", budget: 3, members: 25, onsite: true, label: "Tree walk, Oct 5" });
  const pool = [...hough.slice(0, 60), ...glenville], hot = pool.slice(0, 25);
  for (const code of q.codes.slice(0, 17)) { const picks = new Set(); while (picks.size < 3) picks.add(pick(pool, hot)); for (const id of picks) await Store.vote(code, id, "yes", true); }
}
